AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  rer-api-wrapper

  AWS lambda function for running https://github.com/cbility/RER-API-wrapper

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 30

Resources:
  RERWrapperApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      # API keys are enforced with x-api-key, but SAM deploy still treats this as
      # not having an authorizer such as IAM, Cognito, or Lambda authorizer.
      Auth:
        ApiKeyRequired: true

  RERWrapperFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: rer_api_wrapper.lambda_handler.handler
      Runtime: python3.12
      Architectures:
        - x86_64
      Events:
        ProxyRoute:
          Type: Api
          Properties:
            RestApiId: !Ref RERWrapperApi
            Path: /{proxy+}
            Method: any
            Auth:
              ApiKeyRequired: true

  RERSessionAuthApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Auth:
        ApiKeyRequired: true

  RERSessionAuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: session_auth/
      Handler: rer_session_auth.handler.handler
      Runtime: python3.12
      Timeout: 300
      MemorySize: 2048
      Architectures:
        - x86_64
      Environment:
        Variables:
          RER_WRAPPER_FUNCTION_NAME: !Ref RERWrapperFunction
          PLAYWRIGHT_HEADLESS: "true"
          RER_MFA_MAX_RETRIES: "5"
          RER_MFA_WAIT_SECONDS: "10"
          RER_EMAIL: ""
          RER_PASSWORD: ""
          GMAIL_TOKEN_JSON: ""
          GMAIL_TOKEN_FILE: ""
          SMARTSUITE_API_URL: ""
          SMARTSUITE_API_TOKEN: ""
          SMARTSUITE_APP_ID: ""
          SMARTSUITE_TABLE_ID: ""
          SMARTSUITE_RECORD_ID: ""
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref RERWrapperFunction
      Events:
        ProxyRoute:
          Type: Api
          Properties:
            RestApiId: !Ref RERSessionAuthApi
            Path: /{proxy+}
            Method: any
            Auth:
              ApiKeyRequired: true

  RERWrapperApiUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn:
      - RERWrapperApiProdStage
    Properties:
      UsagePlanName: RERWrapperUsagePlan
      ApiStages:
        - ApiId: !Ref RERWrapperApi
          Stage: Prod

  RERSessionAuthApiUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn:
      - RERSessionAuthApiProdStage
    Properties:
      UsagePlanName: RERSessionAuthUsagePlan
      ApiStages:
        - ApiId: !Ref RERSessionAuthApi
          Stage: Prod

  RERWrapperApiKeyOne:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Enabled: true
      Name: RERWrapperApiKeyOne

  RERWrapperApiKeyTwo:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Enabled: true
      Name: RERWrapperApiKeyTwo

  RERSessionAuthApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Enabled: true
      Name: RERSessionAuthApiKey

  RERWrapperUsagePlanKeyOne:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref RERWrapperApiKeyOne
      KeyType: API_KEY
      UsagePlanId: !Ref RERWrapperApiUsagePlan

  RERWrapperUsagePlanKeyTwo:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref RERWrapperApiKeyTwo
      KeyType: API_KEY
      UsagePlanId: !Ref RERWrapperApiUsagePlan

  RERSessionAuthUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref RERSessionAuthApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref RERSessionAuthApiUsagePlan

Outputs:
  RERWrapperApiUrl:
    Description: "API Gateway endpoint URL for the RER wrapper"
    Value: !Sub "https://${RERWrapperApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/"
  RERSessionAuthApiUrl:
    Description: "API Gateway endpoint URL for the RER session auth proxy"
    Value: !Sub "https://${RERSessionAuthApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/"
  RERWrapperFunction:
    Description: "RER wrapper Lambda Function ARN"
    Value: !GetAtt RERWrapperFunction.Arn
  RERSessionAuthFunction:
    Description: "RER session auth Lambda Function ARN"
    Value: !GetAtt RERSessionAuthFunction.Arn
  RERWrapperFunctionIamRole:
    Description: "Implicit IAM Role created for RER wrapper"
    Value: !GetAtt RERWrapperFunctionRole.Arn
  RERSessionAuthFunctionIamRole:
    Description: "Implicit IAM Role created for RER session auth proxy"
    Value: !GetAtt RERSessionAuthFunctionRole.Arn
